name: Prepare the supplied Sonion ringtone
on:
  push:
    branches: ['release/6.0.9']
    paths: ['.github/workflows/ingest-sonion-ringtone.yml']
permissions:
  contents: write
jobs:
  ringtone:
    runs-on: ubuntu-latest
    steps:
      - name: Validate and store the exact MP3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-all-errors --max-time 45 'https://www.dropbox.com/scl/fi/asrpyidfsrg3bwx9e09u7/ringring.mp3?rlkey=mg7j1afyz14rn88bg9sja98lv&dl=1' -o ringring.mp3
          file -b ringring.mp3
          codec=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 ringring.mp3)
          test "$codec" = 'mp3'
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 ringring.mp3
          printf 'RINGRING_SHA256=%s\n' "$(sha256sum ringring.mp3 | cut -d ' ' -f 1)"
          python - <<'PY'
          import base64, json
          from pathlib import Path
          sound = Path("ringring.mp3").read_bytes()
          encoded = base64.b64encode(sound).decode("ascii")
          lines = ['SonionRingtoneData() {', '    data := ""']
          lines += ['    data .= "' + encoded[i:i + 2048] + '"' for i in range(0, len(encoded), 2048)]
          lines += ['    return data', '}', '']
          payload = base64.b64encode('\n'.join(lines).encode()).decode()
          Path("git-blob.json").write_text(json.dumps({"encoding":"base64","content":payload}))
          PY
          sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input git-blob.json --jq .sha)
          printf 'RINGRING_BLOB=%s\n' "$sha"
