name: Meso Control 6.1.4 Windows validation

on:
  push:
    branches: ['release/6.1.4']
    paths: ['version.ini', 'Lib/**', 'Tests/**', '.github/workflows/meso-control-6-validation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Restore release baseline
        shell: pwsh
        run: |
          $asset = 'Meso_Control_6_1_3_COMPLETE.zip'
          $uri = 'https://github.com/OPPA-1/meso-control-updates/releases/download/6.1.3/' + $asset
          Invoke-WebRequest $uri -OutFile "$env:RUNNER_TEMP/$asset"
          $actual = (Get-FileHash "$env:RUNNER_TEMP/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '92fc6084b5c93e3d3008fc4e811c460696ebc6b933e983707cedcbce2af86123') { throw 'Baseline ZIP checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/$asset" "$env:RUNNER_TEMP/meso-baseline"
          Copy-Item "$env:RUNNER_TEMP/meso-baseline" "$env:RUNNER_TEMP/meso" -Recurse
          foreach ($entry in @(git ls-files | Where-Object { $_ -match '^(Lib/|Tests/|Ui/(sonion_(jeff|ring_default)|scare1|omni)\.png$|[12]\.wav$|StreamerBot/|Meso_.*\.(ahk|vbs)$|version\.ini$)' })) {
            $target = Join-Path "$env:RUNNER_TEMP/meso" $entry
            New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
            Copy-Item -LiteralPath $entry -Destination $target -Force
          }
          Remove-Item "$env:RUNNER_TEMP/meso/Ui/scare2.png" -ErrorAction SilentlyContinue
      - name: Validate the bundled Sonion portrait
        shell: pwsh
        run: |
          $portrait = Join-Path $env:RUNNER_TEMP 'meso/Ui/sonion_ring_default.png'
          if ((Get-FileHash -LiteralPath $portrait -Algorithm SHA256).Hash -ne 'd50ada00f786930d5ed51e7ad00a64d1f876d57dc0781053fe6584d9eb93e4d9') { throw 'Sonion portrait differs from the supplied PNG' }
      - name: Validate with AutoHotkey
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.31/AutoHotkey_2.0.31.zip -OutFile "$env:RUNNER_TEMP/ahk.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP/ahk.zip").Hash -ne 'ca1a595aca4528755d8d4cd7fed23d497a37bd9a0b6892072612d68dee1bd00a') { throw 'AutoHotkey ZIP checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/ahk.zip" "$env:RUNNER_TEMP/ahk"
          $ahk = "$env:RUNNER_TEMP/ahk/AutoHotkey64.exe"
          $app = "$env:RUNNER_TEMP/meso"
          function Run-Ahk($path, [switch]$Validate) {
            $arg = @('/ErrorStdOut=UTF-8', '/Force')
            if ($Validate) { $arg += '/Validate' }
            $arg += '"' + $path + '"'
            $stdout = "$env:RUNNER_TEMP/ahk-stdout.txt"
            $stderr = "$env:RUNNER_TEMP/ahk-stderr.txt"
            Write-Host "AutoHotkey: $path"
            $job = Start-Process $ahk -ArgumentList $arg -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $finished = $job.WaitForExit(30000)
            if (-not $finished) {
              Get-Process -Id $job.Id | Select-Object Id, MainWindowTitle | Format-List
              $job.Kill()
              $job.WaitForExit()
            }
            Get-Content $stdout,$stderr
            if (-not $finished -or $job.ExitCode -ne 0) { throw "AutoHotkey failed or timed out: $path" }
          }
          foreach ($entry in @('Meso_Control.ahk','Meso_Stream_Output.ahk','Meso_Visual_Effect.ahk','Meso_Sliding_Puzzle.ahk','Meso_Screen_Filter.ahk')) {
            Run-Ahk (Join-Path $app $entry) -Validate
          }
          $tests = @('Feature600Tests','CoreTests','WheelRelayTests','ChatRelayTests','OutputProtocolTests','Feature528Tests','Puzzle612Tests','Interaction613Tests','Mirror613Tests','Replay613Tests','ScreenFilter614Tests')
          $failures = @()
          foreach ($test in $tests) {
            $path = Join-Path $app "Tests/$test.ahk"
            $source = [IO.File]::ReadAllText($path)
            if ($test -eq 'Feature600Tests') {
              $all = Get-Content (Join-Path $app 'Meso_Control.ahk') | Where-Object { $_ -like '#Include *' }
              foreach ($include in $all) {
                $source = $include.Replace('#Include ', '#Include ..\') + [Environment]::NewLine + $source
              }
            }
            $source = [regex]::Replace($source, '(?m)^\s*MsgBox\([^\r\n]*\)\r?$', '')
            $handler = '#Warn All, Off' + [Environment]::NewLine + 'OnError((err, mode) => (FileAppend(err.Message " (" err.File ":" err.Line ")" Chr(10), "*"), ExitApp(1)))'
            [IO.File]::WriteAllText($path, $handler + [Environment]::NewLine + $source, [Text.UTF8Encoding]::new($true))
            try { Run-Ahk $path } catch { $failures += $_; Write-Host $_ }
          }
          foreach ($test in $tests) {
            $entry = "Tests/$test.ahk"
            $source = Join-Path "$env:RUNNER_TEMP/meso-baseline" $entry
            if (Test-Path $entry) { $source = $entry }
            Copy-Item -LiteralPath $source -Destination (Join-Path $app $entry) -Force
          }
          if ($failures.Count) { throw ($failures -join "`n") }
      - name: Validate transparent scare assets and audio
        shell: powershell
        run: |
          & "$env:RUNNER_TEMP/meso/Tests/Feature610Assets.ps1" -Root "$env:RUNNER_TEMP/meso"
      - name: Report Windows audio endpoint availability
        shell: powershell
        run: |
          Add-Type -Namespace Meso -Name AudioProbe -MemberDefinition @'
          [System.Runtime.InteropServices.DllImport("winmm.dll")]
          public static extern uint waveOutGetNumDevs();
          '@
          Write-Host "Wave output devices: $([Meso.AudioProbe]::waveOutGetNumDevs())"
      - name: Check Raw Accel integration
        shell: powershell
        run: |
          $asset = "$env:RUNNER_TEMP/RawAccel.zip"
          Invoke-WebRequest -UseBasicParsing 'https://github.com/RawAccelOfficial/rawaccel/releases/download/v1.7.1/RawAccel_v1.7.1.zip' -OutFile $asset
          if ((Get-FileHash $asset).Hash -ne '770fe3ae0919ca3c4d412f58c985eb27f5434decad809f7e8206de4e8852eec4') { throw 'Unexpected Raw Accel package' }
          Expand-Archive $asset "$env:RUNNER_TEMP/meso-driver-test"
          $folder = "$env:RUNNER_TEMP/meso-driver-test/RawAccel"
          $null = [Reflection.Assembly]::LoadFrom("$folder/Newtonsoft.Json.dll")
          $null = [Reflection.Assembly]::LoadFrom("$folder/wrapper.dll")
          $baseline = [DriverConfig]::GetDefault()
          foreach ($factor in @(3.0, 0.25)) {
            $copy = [DriverConfig]::Convert($baseline.ToJSON()).Item1
            $profile = $copy.profiles[0]
            $profile.outputDPI *= $factor
            $copy.SetProfileAt(0, $profile)
            $actual = [DriverConfig]::Convert($copy.ToJSON()).Item1.profiles[0].outputDPI
            if ($actual -ne ($baseline.profiles[0].outputDPI * $factor)) { throw "Unexpected multiplier: $factor" }
          }
          $status = "$env:RUNNER_TEMP/meso-driver-test/worker.state"
          $ps64 = "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe"
          $worker = "$env:RUNNER_TEMP/meso/Lib/RawAccelEffect.ps1"
          & $ps64 -NoProfile -NonInteractive -File $worker -Folder $folder -StatusPath $status -ControllerPid $PID -Target 1 -DurationMs 100 -Multiplier '3.0'
          $exit = $LASTEXITCODE
          $result = Get-Content -LiteralPath $status -Raw
          Write-Output $result
          if ($exit -ne 1 -or $result -notmatch '^error\|Install Raw Accel') { throw 'Missing driver did not produce the expected status' }
          $global:LASTEXITCODE = 0
      - name: Package and test a 6.1.3 upgrade
        shell: pwsh
        run: |
          $app = "$env:RUNNER_TEMP/meso"
          $baseline = "$env:RUNNER_TEMP/meso-baseline"
          & "$app/Lib/CreateRelease.ps1" -Root $app
          $zip = "$app/Releases/Meso_Control_6_1_4_COMPLETE.zip"
          Copy-Item "$baseline/Defaults/Meso_Chaos.ini" "$baseline/Meso_Chaos.ini"
          Add-Content "$baseline/Meso_Chaos.ini" "[Updates]`nForceAuto=0"
          New-Item -ItemType Directory -Force "$baseline/Profiles", "$baseline/Macros" | Out-Null
          Set-Content "$baseline/Profiles/test.ini" 'profile sentinel'
          Set-Content "$baseline/Macros/test.msq" 'macro sentinel'
          & "$baseline/Lib/GitHubUpdateTools.ps1" -Operation StageLocal -Root $baseline -LocalZip $zip
          if ((Get-Content "$baseline/.updates/status.ini" -Raw) -notmatch 'State=ready') { throw '6.1.3 could not stage 6.1.4' }
          & "$baseline/Lib/GitHubUpdateTools.ps1" -Operation Apply -Root $baseline -Interpreter "$env:RUNNER_TEMP/ahk/AutoHotkey64.exe"
          if ((Get-Content "$baseline/.updates/status.ini" -Raw) -notmatch 'State=installed') { throw '6.1.3 could not install 6.1.4' }
          if ((Get-Content "$baseline/version.ini" -Raw) -notmatch 'Version=6\.1\.4') { throw 'Installed version mismatch' }
          if ((Get-Content "$baseline/Meso_Chaos.ini" -Raw) -notmatch '\[P1\]') { throw 'Settings missing after upgrade' }
          if ((Get-Content "$baseline/Profiles/test.ini") -ne 'profile sentinel') { throw 'Profile was modified' }
          if ((Get-Content "$baseline/Macros/test.msq") -ne 'macro sentinel') { throw 'Macro was modified' }
          $expected = (Get-Content "$zip.sha256" -Raw).Split(' ')[0]
          if ((Get-FileHash $zip).Hash -ne $expected) { throw 'Release checksum mismatch' }
      - name: Verify quiet update relaunch and real settings controls
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP/meso-session"
          $zip = "$env:RUNNER_TEMP/meso/Releases/Meso_Control_6_1_4_COMPLETE.zip"
          Expand-Archive $zip $root
          Copy-Item "$root/Defaults/Meso_Chaos.ini" "$root/Meso_Chaos.ini"
          Add-Content "$root/Meso_Chaos.ini" "[Updates]`nForceAuto=0"
          & "$root/Lib/GitHubUpdateTools.ps1" -Operation StageLocal -Root $root -LocalZip $zip
          Copy-Item "$root/Tests/Update614Session.ahk" "$root/Meso_UpdateSession614_Test.ahk"
          $ahk = "$env:RUNNER_TEMP/ahk/AutoHotkey64.exe"
          $arguments = @('/ErrorStdOut=UTF-8','/Force')
          $arguments += '"' + "$root/Meso_UpdateSession614_Test.ahk" + '"'
          $job = Start-Process $ahk -WorkingDirectory $root -RedirectStandardOutput "$root/session-test-stdout.txt" -RedirectStandardError "$root/session-test-stderr.txt" -ArgumentList $arguments -PassThru
          $deadline = (Get-Date).AddSeconds(40)
          $restored = $false
          try {
            while ((Get-Date) -lt $deadline) {
              $job.Refresh()
              if ($job.HasExited -and !(Test-Path "$root/runtime/session-test-original.state")) {
                Get-Content "$root/session-test-stdout.txt","$root/session-test-stderr.txt" -ErrorAction SilentlyContinue
                throw 'The session harness exited before requesting an update'
              }
              if (Test-Path "$root/session-test-error.txt") { throw (Get-Content "$root/session-test-error.txt" -Raw) }
              if (Test-Path "$root/runtime/session-test-original.state") {
                $original = (Get-Content "$root/runtime/session-test-original.state" -Raw).Trim().Split('|')
                if (Test-Path "$root/runtime/controller.info") {
                  $info = @(Get-Content "$root/runtime/controller.info")
                  $state = Get-Content "$root/runtime/output.state" -Raw -ErrorAction SilentlyContinue
                  $health = Get-Content "$root/runtime/output-health.info" -Raw -ErrorAction SilentlyContinue
                  if ($info.Count -ge 3 -and [int]$info[2] -ne [int]$original[0] -and $state -match '(?m)^status\|1\|0\|1\r?$' -and $state -match '(?m)^timer\|ready\|' -and $state -match 'LAST WISH' -and $health -match '^\d+\|') {
                    $renderer = [int]$health.Split('|')[0]
                    if ($renderer -ne [int]$original[1] -and (Get-Process -Id $renderer -ErrorAction SilentlyContinue)) {
                      $restored = $true
                      break
                    }
                  }
                }
              }
              Start-Sleep -Milliseconds 150
            }
            if (!$restored) {
              Get-Content "$root/session-test-progress.txt","$root/session-test-stdout.txt","$root/session-test-stderr.txt" -ErrorAction SilentlyContinue
              Get-Content "$root/.updates/status.ini","$root/runtime/output.state","$root/runtime/controller.info","$root/runtime/session-test-engine.state","$root/runtime/sequence-busy.state","$root/runtime/output-update-ready.state" -ErrorAction SilentlyContinue
              Get-Content "$root/runtime/Meso.log" -Tail 50 -ErrorAction SilentlyContinue
              throw 'The automatic update did not restore the controller and stream output session'
            }
            if (Test-Path "$root/.updates/session.ini") { throw 'Session restore receipt was not consumed' }
            if ((Get-Content "$root/.updates/status.ini" -Raw) -notmatch 'State=installed') { throw 'Quiet update did not finish' }
            Write-Host 'PASS real audio, puzzle, blur and bonus settings, install button, automatic install with Settings open, output relaunch and session preservation'
          } finally {
            if (Test-Path "$root/runtime/controller.info") {
              $info = @(Get-Content "$root/runtime/controller.info")
              if ($info.Count -ge 3) { Stop-Process -Id ([int]$info[2]) -Force -ErrorAction SilentlyContinue }
            }
            if (Test-Path "$root/runtime/output-health.info") {
              $health = Get-Content "$root/runtime/output-health.info" -Raw
              Stop-Process -Id ([int]$health.Split('|')[0]) -Force -ErrorAction SilentlyContinue
            }
            Stop-Process -Id $job.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Meso-Control-6.1.4-Diagnostics
          path: |
            ${{ runner.temp }}/ahk-*.txt
            ${{ runner.temp }}/meso-session/session-test-*.txt
            ${{ runner.temp }}/meso-session/runtime/*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Meso-Control-6.1.4-Windows
          path: ${{ runner.temp }}/meso/Releases/*
          if-no-files-found: error

  publish:
    needs: validate
    if: github.repository == 'OPPA-1/meso-control-updates' && github.ref == 'refs/heads/release/6.1.4'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
    concurrency:
      group: meso-control-614-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Meso-Control-6.1.4-Windows
          path: release
      - name: Publish 6.1.4
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          zip=Meso_Control_6_1_4_COMPLETE.zip
          sha256sum -c "$zip.sha256"
          if gh release view 6.1.4 >/dev/null 2>&1; then
            echo 'Release 6.1.4 already exists. Checking its downloads.'
          else
            gh release create 6.1.4 "$zip" "$zip.sha256" --target "$GITHUB_SHA" \
              --title 'Meso Control 6.1.4' \
              --notes 'Meso Control 6.1.4 | Hazy Vision, Mirror Screen and Update Fixes' \
              --draft
            gh release edit 6.1.4 --draft=false --latest
          fi
      - name: Verify public updater downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          zip=Meso_Control_6_1_4_COMPLETE.zip
          mkdir downloaded
          cd downloaded
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/latest" > release.json &&
              jq -e '.tag_name == "6.1.4" and (.draft | not) and (.prerelease | not)' release.json >/dev/null; then
              break
            fi
            sleep 4
          done
          jq -e '.tag_name == "6.1.4" and (.draft | not) and (.prerelease | not)' release.json
          for asset in "$zip" "$zip.sha256"; do
            uri=$(jq -er --arg asset "$asset" '.assets[] | select(.name == $asset) | .browser_download_url' release.json)
            curl --fail --silent --show-error --location --retry 3 "$uri" -o "$asset"
          done
          sha256sum -c "$zip.sha256"
          unzip -tq "$zip"
          python - "$zip" 63009c1f588aa1d9a03a013f8bb7665ba8e42acd66002f02d9e69b32c38de734 <<'PY'
          import base64, hashlib, re, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              source = z.read("Lib/SonionRingtone.ahk").decode("utf-8-sig").replace("\r\n", "\n")
          chunks = re.findall(r'(?m)^\s*data \.= "([A-Za-z0-9+/=]+)"$', source)
          sound = base64.b64decode("".join(chunks), validate=True)
          if hashlib.sha256(sound).hexdigest() != sys.argv[2]:
              raise SystemExit("Bundled ringtone differs from the supplied MP3")
          print("Published ZIP contains the exact supplied ringtone")
          PY
          actual_portrait=$(unzip -p "$zip" Ui/sonion_ring_default.png | sha256sum | cut -d ' ' -f 1)
          test "$actual_portrait" = 'd50ada00f786930d5ed51e7ad00a64d1f876d57dc0781053fe6584d9eb93e4d9'
          echo 'Published ZIP contains the exact Sonion PNG'
          unzip -p "$zip" version.ini | tr -d '\r' | grep -Fx 'Version=6.1.4'

  verify-updater:
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Check online from the 6.1.3 updater
        shell: powershell
        run: |
          $root = "$env:RUNNER_TEMP/meso-online"
          $baseline = "$env:RUNNER_TEMP/Meso_Control_6_1_3_COMPLETE.zip"
          Invoke-WebRequest -UseBasicParsing 'https://github.com/OPPA-1/meso-control-updates/releases/download/6.1.3/Meso_Control_6_1_3_COMPLETE.zip' -OutFile $baseline
          if ((Get-FileHash $baseline).Hash -ne '92fc6084b5c93e3d3008fc4e811c460696ebc6b933e983707cedcbce2af86123') { throw 'Baseline ZIP checksum mismatch' }
          Expand-Archive $baseline $root
          & "$root/Lib/GitHubUpdateTools.ps1" -Operation Check -Root $root -Repository OPPA-1/meso-control-updates
          $status = Get-Content "$root/.updates/status.ini" -Raw
          Write-Output $status
          if ($status -notmatch 'State=ready' -or $status -notmatch 'Version=6\.1\.4') { throw 'The 6.1.3 updater did not stage 6.1.4' }

