name: Store verified Sonion portrait
on:
  push:
    branches: ['release/6.0.6']
permissions:
  contents: write
jobs:
  portrait:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Record the exact PNG in the release repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --retry-all-errors 'https://i.imgur.com/UBhriTZ.png' -o sonion.png
          printf '%s  sonion.png\n' 'd50ada00f786930d5ed51e7ad00a64d1f876d57dc0781053fe6584d9eb93e4d9' | sha256sum -c -
          python -c 'import base64, json; print(json.dumps({"encoding":"base64","content":base64.b64encode(open("sonion.png","rb").read()).decode()}))' > git-blob.json
          sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input git-blob.json --jq .sha)
          printf 'SONION_BLOB=%s\n' "$sha"
