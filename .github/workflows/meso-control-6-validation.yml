name: Compare Sonion caller image
on:
  push:
    branches: ['release/6.0.5']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect the public Sonion versions
        shell: bash
        run: |
          set -eu
          python -m pip -q install pillow
          python - <<'PY'
          import base64, io, urllib.request
          from PIL import Image
          from concurrent.futures import ThreadPoolExecutor
          urls = ["https://media1.tenor.com/m/KahFad6pbbsAAAAd/son.gif","https://media1.tenor.com/m/JHqDxZx0rGYAAAAd/sonion-ring-sona.gif","https://media1.tenor.com/m/y8qV65cJ33gAAAAd/son-sonion.gif","https://media1.tenor.com/m/I13_hvT0954AAAAd/onion-ring-onion.gif","https://media1.tenor.com/m/B3cWDDEKMFQAAAAd/son-sonion.gif"]
          def get(pair):
              i, url = pair
              try:
                  request = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(request, timeout=12) as response:
                      src = Image.open(io.BytesIO(response.read(4000000)))
                      dims = src.size
                      src = src.convert("RGB")
                      src.thumbnail((180,180))
                      out = io.BytesIO()
                      src.save(out, format="JPEG", quality=74)
                      print(f"CALLER_{i}_SIZE={dims} {url}", flush=True)
                      print(f"CALLER_{i}_JPEG={base64.b64encode(out.getvalue()).decode()}", flush=True)
              except Exception as e:
                  print(f"CALLER_{i}_ERROR={e}", flush=True)
          with ThreadPoolExecutor(max_workers=3) as pool:
              list(pool.map(get, enumerate(urls)))
          PY
