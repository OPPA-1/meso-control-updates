name: Meso Control 6.0.0 Windows validation

on:
  push:
    branches: ['release/6.0.0']
    paths: ['version.ini', 'Lib/**', 'Tests/**', '.github/workflows/meso-control-6-validation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Restore release baseline
        shell: pwsh
        run: |
          $asset = 'Meso_Control_5_2_8_COMPLETE.zip'
          $uri = 'https://github.com/OPPA-1/meso-control-updates/releases/download/5.2.8/' + $asset
          Invoke-WebRequest $uri -OutFile "$env:RUNNER_TEMP/$asset"
          $actual = (Get-FileHash "$env:RUNNER_TEMP/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '3c9236c5208d39ee5e919fc95bd534a6776e5503e45cf5d901ac42ce87b41c50') { throw 'Baseline ZIP checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/$asset" "$env:RUNNER_TEMP/meso-baseline"
          Copy-Item "$env:RUNNER_TEMP/meso-baseline" "$env:RUNNER_TEMP/meso" -Recurse
          foreach ($entry in @(git ls-files | Where-Object { $_ -match '^(Lib/|Tests/|StreamerBot/|Meso_.*\.(ahk|vbs)$|version\.ini$)' })) {
            $target = Join-Path "$env:RUNNER_TEMP/meso" $entry
            New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
            Copy-Item -LiteralPath $entry -Destination $target -Force
          }
      - name: Validate with AutoHotkey
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.31/AutoHotkey_2.0.31.zip -OutFile "$env:RUNNER_TEMP/ahk.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP/ahk.zip").Hash -ne 'ca1a595aca4528755d8d4cd7fed23d497a37bd9a0b6892072612d68dee1bd00a') { throw 'AutoHotkey ZIP checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/ahk.zip" "$env:RUNNER_TEMP/ahk"
          $ahk = "$env:RUNNER_TEMP/ahk/AutoHotkey64.exe"
          $app = "$env:RUNNER_TEMP/meso"
          function Run-Ahk($path, [switch]$Validate) {
            $arg = @('/ErrorStdOut=UTF-8', '/Force')
            if ($Validate) { $arg += '/Validate' }
            $arg += '"' + $path + '"'
            $stdout = "$env:RUNNER_TEMP/ahk-stdout.txt"
            $stderr = "$env:RUNNER_TEMP/ahk-stderr.txt"
            Write-Host "AutoHotkey: $path"
            $job = Start-Process $ahk -ArgumentList $arg -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $finished = $job.WaitForExit(16000)
            if (-not $finished) {
              Get-Process -Id $job.Id | Select-Object Id, MainWindowTitle | Format-List
              $job.Kill()
              $job.WaitForExit()
            }
            Get-Content $stdout,$stderr
            if (-not $finished -or $job.ExitCode -ne 0) { throw "AutoHotkey failed or timed out: $path" }
          }
          foreach ($entry in @('Meso_Control.ahk','Meso_Stream_Output.ahk','Meso_Visual_Effect.ahk')) {
            Run-Ahk (Join-Path $app $entry) -Validate
          }
          $tests = @('Feature600Tests','CoreTests','WheelRelayTests','ChatRelayTests','OutputProtocolTests','Feature528Tests')
          foreach ($test in $tests) {
            $path = Join-Path $app "Tests/$test.ahk"
            $source = [IO.File]::ReadAllText($path)
            if ($test -eq 'Feature600Tests') {
              $all = Get-Content (Join-Path $app 'Meso_Control.ahk') | Where-Object { $_ -like '#Include *' }
              foreach ($include in $all) {
                $source = $include.Replace('#Include ', '#Include ..\') + [Environment]::NewLine + $source
              }
            }
            $source = [regex]::Replace($source, '(?m)^\s*MsgBox\([^\r\n]*\)\r?$', '')
            $handler = '#Warn All, Off' + [Environment]::NewLine + 'OnError((err, mode) => (FileAppend(err.Message " (" err.File ":" err.Line ")" Chr(10), "*"), ExitApp(1)))'
            [IO.File]::WriteAllText($path, $handler + [Environment]::NewLine + $source, [Text.UTF8Encoding]::new($true))
            Run-Ahk $path
          }
          foreach ($test in $tests) {
            $entry = "Tests/$test.ahk"
            $source = Join-Path "$env:RUNNER_TEMP/meso-baseline" $entry
            if (Test-Path $entry) { $source = $entry }
            Copy-Item -LiteralPath $source -Destination (Join-Path $app $entry) -Force
          }
      - name: Package and test a 5.2.8 upgrade
        shell: pwsh
        run: |
          $app = "$env:RUNNER_TEMP/meso"
          $baseline = "$env:RUNNER_TEMP/meso-baseline"
          & "$app/Lib/CreateRelease.ps1" -Root $app
          $zip = "$app/Releases/Meso_Control_6_0_0_COMPLETE.zip"
          Copy-Item "$baseline/Defaults/Meso_Chaos.ini" "$baseline/Meso_Chaos.ini"
          $oldSettings = Get-Content "$baseline/Meso_Chaos.ini" -Raw
          New-Item -ItemType Directory -Force "$baseline/Profiles", "$baseline/Macros" | Out-Null
          Set-Content "$baseline/Profiles/test.ini" 'profile sentinel'
          Set-Content "$baseline/Macros/test.msq" 'macro sentinel'
          & "$baseline/Lib/GitHubUpdateTools.ps1" -Operation StageLocal -Root $baseline -LocalZip $zip
          if ((Get-Content "$baseline/.updates/status.ini" -Raw) -notmatch 'State=ready') { throw '5.2.8 could not stage 6.0.0' }
          & "$baseline/Lib/GitHubUpdateTools.ps1" -Operation Apply -Root $baseline -Interpreter "$env:RUNNER_TEMP/ahk/AutoHotkey64.exe"
          if ((Get-Content "$baseline/.updates/status.ini" -Raw) -notmatch 'State=installed') { throw '5.2.8 could not install 6.0.0' }
          if ((Get-Content "$baseline/version.ini" -Raw) -notmatch 'Version=6\.0\.0') { throw 'Installed version mismatch' }
          if ((Get-Content "$baseline/Meso_Chaos.ini" -Raw) -notmatch '\[P1\]') { throw 'Settings missing after upgrade' }
          if ((Get-Content "$baseline/Profiles/test.ini") -ne 'profile sentinel') { throw 'Profile was modified' }
          if ((Get-Content "$baseline/Macros/test.msq") -ne 'macro sentinel') { throw 'Macro was modified' }
          $expected = (Get-Content "$zip.sha256" -Raw).Split(' ')[0]
          if ((Get-FileHash $zip).Hash -ne $expected) { throw 'Release checksum mismatch' }
      - uses: actions/upload-artifact@v4
        with:
          name: Meso-Control-6.0.0-Windows
          path: ${{ runner.temp }}/meso/Releases/*
          if-no-files-found: error
