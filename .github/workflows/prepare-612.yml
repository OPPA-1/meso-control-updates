name: Prepare 6.1.2 source
on:
  push:
    branches: ['release/6.1.2']
    paths: ['.github/workflows/prepare-612.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/6.1.2
      - name: Prepare release source and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Tests/Prepare612*.py
          python3 Tests/Prepare612Core.py
          python3 Tests/Prepare612Modules.py
          python3 Tests/Prepare612Media.py
          python3 Tests/Prepare612Updates.py
          python3 Tests/Prepare612Tests.py
          git -c core.whitespace=cr-at-eol diff --check
          git config user.name OPPA-1
          git config user.email oap.channel@gmail.com
          git add Lib Tests Ui Meso_*.ahk version.ini 1.wav 2.wav
          git commit -m 'Implement Meso Control 6.1.2'
          git push origin HEAD:release/6.1.2
